# Static hosting for the Interscale Travel CRM public marketing website, served
# by Nginx behind the production Application Load Balancer.
#
# This container serves ONLY the public marketing site. It never proxies the
# CRM API: any /api request reaching Nginx returns 404. The ALB routes /api on
# app.travelagencycrm.in to the API target group; this marketing service has no
# API behaviour at all.
#
# The nginx-unprivileged base image runs as a non-root user and listens on 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers applied site-wide (also included in each serving
    # location because nginx does not inherit add_header past a block that
    # defines its own).
    include /etc/nginx/conf.d/nginx-security-headers.conf;

    # Container / load-balancer health probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static assets (robots.txt, sitemap.xml, images, hashed assets).
    location ^~ /assets/ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(png|svg|jpg|jpeg|webp|ico|txt|xml|webmanifest)$ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # HTML pages: no aggressive caching so new deploys are picked up quickly.
    location ~* \.html$ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Defense in depth: the marketing container never serves the CRM API.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }

    # Unknown files with an extension must return a real 404, never index.html.
    location ~* \.[a-z0-9]+$ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri =404;
    }

    # Clean URLs (/privacy -> privacy.html) and a custom 404 page for anything
    # else. No SPA fallback: the marketing site has no client-side router.
    location = /privacy {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files /privacy.html =404;
    }
    location = /terms {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files /terms.html =404;
    }
    location = /404.html {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files /404.html =404;
    }

    location / {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
