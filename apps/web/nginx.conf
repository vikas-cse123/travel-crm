# Static hosting for the Interscale Travel CRM SPA, served by Nginx behind the
# production Application Load Balancer (no CloudFront).
#
# Paired with the nginx-unprivileged base image, which runs as a non-root user
# and listens on 8080. The ALB routes `/api` and `/api/*` to the API target
# group, so Nginx never sees API traffic; the `/api` 404 blocks below are
# defense in depth and must NOT proxy back to the ALB (that would loop).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # gzip text assets; avoid re-compressing media/archives.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Container / load-balancer health probe. Static, never touches the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The HTML entry point must never be cached, so a new deploy is picked up
    # immediately even while assets stay long-lived.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Hashed, content-addressed build assets: safe to cache forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker / manifest: never cache (both are absent from this build,
    # but kept so they would return real 404s rather than index.html).
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Defense in depth: API paths never reach Nginx via the ALB, but must not
    # fall through to the SPA shell if they somehow do.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }

    # Any path ending in a file extension must return a real 404 when the file
    # is missing — never the SPA shell.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA history fallback: unknown extensionless paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
