name: Diagnose Production API Logs

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  tail-api-logs:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: diag-production-logs

      - name: Tail recent API CloudWatch logs (auth errors)
        run: |
          aws logs filter-log-events \
            --log-group-name "/ecs/interscale-travel-crm-prod/api" \
            --start-time "$(( ($(date +%s) - 7200) * 1000 ))" \
            --filter-pattern "ERROR" \
            --query 'events[].message' \
            --output text | tail -200

      - name: Tail recent API CloudWatch logs (unhandled/error level)
        run: |
          aws logs filter-log-events \
            --log-group-name "/ecs/interscale-travel-crm-prod/api" \
            --start-time "$(( ($(date +%s) - 7200) * 1000 ))" \
            --filter-pattern '"Unhandled error"' \
            --query 'events[].message' \
            --output text | tail -200

      - name: Tail recent API logs (register/auth)
        run: |
          aws logs filter-log-events \
            --log-group-name "/ecs/interscale-travel-crm-prod/api" \
            --start-time "$(( ($(date +%s) - 7200) * 1000 ))" \
            --filter-pattern '"level":50' \
            --query 'events[].message' \
            --output text | tail -200
