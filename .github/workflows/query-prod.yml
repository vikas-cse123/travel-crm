name: Query Production DB

on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'Read-only SQL (SELECT/WITH only) to run against the production database'
        required: true
        default: 'SELECT 1 AS ok'

permissions:
  contents: read
  id-token: write

jobs:
  query:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-interscale-prod-query

      - name: Run read-only query in the production VPC
        env:
          SQL: ${{ github.event.inputs.sql }}
        run: |
          set -Eeuo pipefail
          SQL="$(printf '%s' "$SQL" | xargs)"
          case "$SQL" in
            SELECT*|WITH*) ;;
            *) echo "Only read-only SELECT/WITH queries are allowed." >&2; exit 1 ;;
          esac

          cluster="${{ vars.ECS_CLUSTER }}"
          api_family="${{ vars.API_ECS_SERVICE }}"

          net="$(aws ecs describe-services --cluster "$cluster" --services "$api_family" --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)"
          subnets="$(printf '%s' "$net" | jq -r '.subnets | join(",")')"
          sgs="$(printf '%s' "$net" | jq -r '.securityGroups | join(",")')"
          assign_pub="$(printf '%s' "$net" | jq -r '.assignPublicIp')"

          cat > /tmp/query.cjs <<'EOF'
          const { PrismaClient } = require('@prisma/client');
          const sql = process.argv[1];
          const p = new PrismaClient();
          p.$queryRawUnsafe(sql)
            .then((rows) => {
              console.log('RESULT:' + JSON.stringify(rows));
              return p.$disconnect();
            })
            .catch((e) => {
              console.error('QUERY_FAILED ' + (e && e.message ? e.message : String(e)));
              process.exit(1);
            });
          EOF

          task_json="$(aws ecs describe-task-definition --task-definition "$api_family" --query 'taskDefinition' --output json)"
          td="$(
            printf '%s' "$task_json" | jq --rawfile cmd /tmp/query.cjs --arg sql "$SQL" '
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              | .family = "interscale-travel-crm-prod-query"
              | .containerDefinitions = (.containerDefinitions | map(
                  .name = "query"
                  | .command = ["node", "apps/api/docker-entrypoint.mjs", "node", "-e", $cmd, $sql]
                ))
            '
          )"
          td_file="$(mktemp)"
          printf '%s' "$td" > "$td_file"
          td_arn="$(aws ecs register-task-definition --cli-input-json "file://$td_file" --query 'taskDefinition.taskDefinitionArn' --output text)"
          rm -f "$td_file"
          echo "registered: $td_arn"

          task_arn="$(aws ecs run-task --cluster "$cluster" --task-definition "$td_arn" --launch-type FARGATE --count 1 --network-configuration "awsvpcConfiguration={subnets=[${subnets}],securityGroups=[${sgs}],assignPublicIp=${assign_pub}}" --query 'tasks[0].taskArn' --output text)"
          echo "query task: $task_arn"

          status="PENDING"
          for _ in $(seq 1 60); do
            status="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query 'tasks[0].lastStatus' --output text)"
            [ "$status" = "STOPPED" ] && break
            sleep 10
          done
          [ "$status" = "STOPPED" ] || { echo "query task did not stop in time" >&2; exit 1; }
          code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)"
          echo "query task exit code: $code"

          log_group="$(printf '%s' "$td" | jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-group"] // empty')"
          task_id="${task_arn##*/}"
          stream="$(aws logs describe-log-streams --log-group-name "$log_group" --query "logStreams[?contains(logStreamName, '$task_id')].logStreamName" --output text | tr '\t' '\n' | head -1)"
          echo "--- query output ---"
          if [ -n "$stream" ] && [ "$stream" != "None" ]; then
            aws logs get-log-events --log-group-name "$log_group" --log-stream-name "$stream" --query 'events[].message' --output text || true
          else
            echo "(no log stream found for $task_id)"
          fi
          [ "$code" = "0" ] || exit 1
