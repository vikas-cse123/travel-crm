name: Deploy Production

on:
  # Deploy only AFTER the main CI workflow succeeds for the same commit. This
  # replaces the previous `push` trigger so a red CI run never reaches prod.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: 'Services to deploy (auto = changed paths, frontend, api, both)'
        type: choice
        options: ['auto', 'frontend', 'api', 'both']
        default: auto
      run_migrations:
        description: 'Run Prisma production migrations (auto, yes, no)'
        type: choice
        options: ['auto', 'yes', 'no']
        default: auto

permissions:
  contents: read
  id-token: write

# One production deployment at a time. The next run waits; active deployments
# are never cancelled by a newer push.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for CI success
    runs-on: ubuntu-latest
    # workflow_dispatch bypasses the CI gate intentionally; workflow_run must be
    # a successful CI completion. Any other outcome skips this job and, because
    # `detect` needs it, the whole production deployment.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve deploy SHA
        id: resolve
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

  detect:
    name: Detect deployment scope
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      deploy_frontend: ${{ steps.scope.outputs.deploy_frontend }}
      deploy_api: ${{ steps.scope.outputs.deploy_api }}
      run_migrations: ${{ steps.scope.outputs.run_migrations }}
      schema_without_migration: ${{ steps.scope.outputs.schema_without_migration }}
      infra_changed: ${{ steps.scope.outputs.infra_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy the exact commit that passed CI, never the current main tip.
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - name: Compute scope
        id: scope
        run: |
          chmod +x .github/scripts/detect-deployment-scope.sh
          ./.github/scripts/detect-deployment-scope.sh \
            | tee /tmp/scope-output.txt
          while IFS='=' read -r key value; do
            [ -n "$key" ] && echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < /tmp/scope-output.txt
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ needs.gate.outputs.sha }}
          DEPLOY_SCOPE_INPUT: ${{ inputs.deploy_scope }}
          RUN_MIGRATIONS_INPUT: ${{ inputs.run_migrations }}

      - name: Report scope
        run: |
          echo "frontend=${{ steps.scope.outputs.deploy_frontend }} api=${{ steps.scope.outputs.deploy_api }} migrations=${{ steps.scope.outputs.run_migrations }} infra=${{ steps.scope.outputs.infra_changed }}"

      - name: Infrastructure changed notice
        if: steps.scope.outputs.infra_changed == 'true'
        run: |
          echo "::notice::Infrastructure (infra/** or .github/**) changed. Run the manual infrastructure deployment process; this workflow does not deploy infrastructure."

  deploy-frontend:
    name: Deploy frontend
    needs: [detect, gate]
    if: needs.detect.outputs.deploy_frontend == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-interscale-production

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.production
          platforms: linux/amd64
          push: true
          build-args: VITE_API_URL=/api
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.FRONTEND_ECR_REPOSITORY }}:${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=frontend-production
          cache-to: type=gha,mode=max,scope=frontend-production

      - name: Capture previous task definition
        id: previous
        run: |
          ARN=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.FRONTEND_ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "previous_task_def=$ARN" >> "$GITHUB_OUTPUT"
          echo "previous task definition: $ARN"

      - name: Prepare frontend task definition
        run: |
          chmod +x .github/scripts/prepare-ecs-task-definition.sh
          ./.github/scripts/prepare-ecs-task-definition.sh \
            "${{ vars.FRONTEND_ECS_SERVICE }}" \
            "${{ steps.ecr-login.outputs.registry }}/${{ vars.FRONTEND_ECR_REPOSITORY }}:${{ needs.gate.outputs.sha }}" \
            /tmp/frontend-taskdef.json

      - name: Register frontend task definition
        id: register
        run: |
          ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/frontend-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "new_task_def=$ARN" >> "$GITHUB_OUTPUT"
          echo "registered: $ARN"

      - name: Update frontend service
        id: update
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.FRONTEND_ECS_SERVICE }}" \
            --task-definition "${{ steps.register.outputs.new_task_def }}" > /dev/null

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.FRONTEND_ECS_SERVICE }}"

      - name: Check target group health
        run: |
          TG=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.FRONTEND_ECS_SERVICE }}" \
            --query 'services[0].loadBalancers[0].targetGroupArn' --output text)
          # During a rolling-update tail the old target is briefly "draining"
          # (expected) and a fresh target may report "initial" before its first
          # probe. Retry until at least one target is healthy and none are
          # failing, so a normal deployment tail is not misread as unhealthy.
          for attempt in 1 2 3 4 5 6; do
            STATES=$(aws elbv2 describe-target-health --target-group-arn "$TG" \
              --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)
            echo "frontend target states (attempt $attempt): $STATES"
            if printf '%s\n' "$STATES" | grep -q 'healthy' \
              && ! printf '%s\n' "$STATES" | grep -qE 'unhealthy|unavailable|initial|no data'; then
              exit 0
            fi
            sleep 10
          done
          echo "frontend target is not healthy" >&2
          exit 1

      - name: Verify production frontend
        run: |
          chmod +x .github/scripts/verify-production.sh
          ./.github/scripts/verify-production.sh frontend

      - name: Frontend job summary
        if: always()
        run: |
          {
            echo "## Frontend deployment"
            echo "**commit:** ${{ needs.gate.outputs.sha }}"
            echo "**image:** ${{ steps.ecr-login.outputs.registry }}/${{ vars.FRONTEND_ECR_REPOSITORY }}:${{ needs.gate.outputs.sha }}"
            echo "**digest:** ${{ steps.build.outputs.digest }}"
            echo "**previous task def:** ${{ steps.previous.outputs.previous_task_def }}"
            echo "**new task def:** ${{ steps.register.outputs.new_task_def }}"
            echo "**status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback frontend service on failure
        if: failure() && steps.update.outcome == 'success'
        run: |
          chmod +x .github/scripts/rollback-ecs-service.sh
          ./.github/scripts/rollback-ecs-service.sh \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.FRONTEND_ECS_SERVICE }}" \
            "${{ steps.previous.outputs.previous_task_def }}"
        continue-on-error: true

  deploy-api:
    name: Deploy API
    needs: [detect, gate]
    if: needs.detect.outputs.deploy_api == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-interscale-production

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Schema changed without migration
        if: needs.detect.outputs.schema_without_migration == 'true'
        run: |
          echo "::error::Prisma schema changed but no production migration was committed. Generate and review a migration locally before deploying."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=api-production
          cache-to: type=gha,mode=max,scope=api-production

      - name: Build and push API migration image (builder stage)
        id: build-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: builder
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:migrate-${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=api-production
          cache-to: type=gha,mode=max,scope=api-production

      - name: Capture previous task definition
        id: previous
        run: |
          ARN=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.API_ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "previous_task_def=$ARN" >> "$GITHUB_OUTPUT"
          echo "previous task definition: $ARN"

      - name: Prepare API task definition
        run: |
          chmod +x .github/scripts/prepare-ecs-task-definition.sh
          ./.github/scripts/prepare-ecs-task-definition.sh \
            "${{ vars.API_ECS_SERVICE }}" \
            "${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:${{ needs.gate.outputs.sha }}" \
            /tmp/api-taskdef.json

      - name: Register API task definition
        id: register
        run: |
          ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/api-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "new_task_def=$ARN" >> "$GITHUB_OUTPUT"
          echo "registered: $ARN"

      - name: Run Prisma migrations
        id: migrate
        if: needs.detect.outputs.run_migrations == 'true'
        run: |
          chmod +x .github/scripts/run-ecs-migration.sh
          ./.github/scripts/run-ecs-migration.sh \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.API_ECS_SERVICE }}" \
            "${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:migrate-${{ needs.gate.outputs.sha }}"

      - name: Update API service
        id: update
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.API_ECS_SERVICE }}" \
            --task-definition "${{ steps.register.outputs.new_task_def }}" > /dev/null

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.API_ECS_SERVICE }}"

      - name: Check target group health
        run: |
          TG=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.API_ECS_SERVICE }}" \
            --query 'services[0].loadBalancers[0].targetGroupArn' --output text)
          # During a rolling-update tail the old target is briefly "draining"
          # (expected) and a fresh target may report "initial" before its first
          # probe. Retry until at least one target is healthy and none are
          # failing, so a normal deployment tail is not misread as unhealthy.
          for attempt in 1 2 3 4 5 6; do
            STATES=$(aws elbv2 describe-target-health --target-group-arn "$TG" \
              --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)
            echo "api target states (attempt $attempt): $STATES"
            if printf '%s\n' "$STATES" | grep -q 'healthy' \
              && ! printf '%s\n' "$STATES" | grep -qE 'unhealthy|unavailable|initial|no data'; then
              exit 0
            fi
            sleep 10
          done
          echo "api target is not healthy" >&2
          exit 1

      - name: Verify production API
        run: |
          chmod +x .github/scripts/verify-production.sh
          ./.github/scripts/verify-production.sh api

      - name: API job summary
        if: always()
        run: |
          {
            echo "## API deployment"
            echo "**commit:** ${{ needs.gate.outputs.sha }}"
            echo "**image:** ${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:${{ needs.gate.outputs.sha }}"
            echo "**digest:** ${{ steps.build.outputs.digest }}"
            echo "**migrations executed:** ${{ needs.detect.outputs.run_migrations }}"
            echo "**previous task def:** ${{ steps.previous.outputs.previous_task_def }}"
            echo "**new task def:** ${{ steps.register.outputs.new_task_def }}"
            echo "**status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback API service on failure
        if: failure() && steps.update.outcome == 'success'
        run: |
          chmod +x .github/scripts/rollback-ecs-service.sh
          ./.github/scripts/rollback-ecs-service.sh \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.API_ECS_SERVICE }}" \
            "${{ steps.previous.outputs.previous_task_def }}"
        continue-on-error: true
